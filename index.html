<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HERV catalog browser</title>
<style>
 :root{--ink:#1b1b1f;--mut:#6b6b76;--line:#dcdce3;--bg:#fbfbfd;--pan:#fff;
       --ltr:#3b6ea5;--int:#a5553b;--orf:#4a7c59;--dom:#8c6d3f;--gene:#7a5c8f;--acc:#2b5f8a;
      --map1:#2f7d4f;--map2:#4a6fa5;--cage1:#c2410c;--cage2:#7c6ba0}
 *{box-sizing:border-box}
 body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      color:var(--ink);background:var(--bg)}
 header{background:var(--pan);border-bottom:1px solid var(--line);padding:14px 20px}
 h1{margin:0 0 10px;font-size:17px;font-weight:600;letter-spacing:-.01em}
 h1 span{font-weight:400;color:var(--mut);font-size:13px;margin-left:8px}
 .searchbar{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
 select,input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#fff}
 select{min-width:190px}
 .sw{position:relative;flex:1;min-width:280px;max-width:520px}
 input{width:100%}
 #hint{font-size:12px;color:var(--mut);margin-top:4px;min-height:16px}
 #results{position:absolute;top:100%;left:0;right:0;z-index:40;background:#fff;
   border:1px solid var(--line);border-radius:5px;margin-top:3px;max-height:340px;overflow-y:auto;
   box-shadow:0 6px 20px rgba(0,0,0,.10);display:none}
 #results.on{display:block}
 .ri{padding:7px 10px;cursor:pointer;border-bottom:1px solid #f0f0f4;display:flex;
     justify-content:space-between;gap:10px;align-items:baseline}
 .ri:last-child{border-bottom:0}
 .ri:hover,.ri.sel{background:#eef4fa}
 .ri b{font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
 .ri em{font-style:normal;color:var(--mut);font-size:12px}
 .badge{font-size:10px;padding:1px 5px;border-radius:3px;background:#eee;color:#555;white-space:nowrap}
 .badge.retired{background:#fbeaea;color:#9a3d3d}
 .badge.ambig{background:#fdf3e2;color:#8c6d3f}
 main{padding:18px 20px;max-width:1180px}
 .empty{color:var(--mut);padding:44px 0;text-align:center}
 .panel{background:var(--pan);border:1px solid var(--line);border-radius:7px;padding:14px 16px;margin-bottom:14px}
 .panel h2{margin:0 0 10px;font-size:13px;font-weight:600;text-transform:uppercase;
   letter-spacing:.05em;color:var(--mut)}
 .idline{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:2px}
 .idline .cid{font-size:21px;font-weight:600;font-family:ui-monospace,Menlo,monospace}
 .idline .uid{font-family:ui-monospace,Menlo,monospace;color:var(--mut);font-size:13px}
 table{border-collapse:collapse;width:100%;font-size:13px}
 th,td{text-align:left;padding:4px 9px 4px 0;vertical-align:top;border-bottom:1px solid #f2f2f6}
 th{font-weight:600;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
 tr:last-child td{border-bottom:0}
 .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px}
 .kv dt{color:var(--mut)}
 .kv dd{margin:0;font-variant-numeric:tabular-nums}
 .mono{font-family:ui-monospace,Menlo,monospace}
 .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
 @media(max-width:820px){.two{grid-template-columns:1fr}}
 a{color:var(--acc)}
 .ucsc{display:inline-block;padding:3px 9px;border:1px solid var(--acc);border-radius:4px;
   font-size:12px;text-decoration:none;margin-right:7px}
 .ucsc:hover{background:#eef4fa}
 .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}
 .lg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
 .note{font-size:12px;color:var(--mut);font-style:italic;margin-top:6px}
 /* A note that reports a discrepancy rather than context -- must not read as
    ordinary small print. */
 .note.warn{color:#8a4b12;font-style:normal;background:#fdf5e8;border-left:3px solid #d99a3e;padding:6px 8px;border-radius:3px}
 svg{display:block;max-width:100%;height:auto}
 .badge.collapse{background:#fdf0e2;border-color:#e0b787;color:#8a5417}
 .tsrc{font-size:10px;color:#777;background:#f2f2f6;border-radius:3px;padding:1px 5px}
 .alts{font-size:10.5px;color:#666;margin-top:2px}
 .alts b{font-weight:600;color:#333}
 .lbar{display:flex;gap:10px;align-items:center;margin:6px 0 10px}
 .lbar input{min-width:260px}
 .pager{display:flex;gap:10px;align-items:center;margin-top:10px}
 .pager button{font:inherit;padding:4px 11px;border:1px solid var(--line);border-radius:5px;
   background:#fff;cursor:pointer}
 .pager button:disabled{color:#bbb;cursor:default;background:#fafafa}
 .tabs{display:flex;gap:2px;margin-bottom:-1px}
 .tab{padding:5px 12px;border:1px solid var(--line);border-bottom:0;border-radius:5px 5px 0 0;
   background:#f2f2f6;cursor:pointer;font-size:12px}
 .tab.on{background:#fff;font-weight:600}
 .tabbody{border:1px solid var(--line);border-radius:0 6px 6px 6px;padding:12px;background:#fff}
/* transcription-evidence chips. Three visual states, matching the three-valued
   semantics: a coloured chip (evidence, tier by colour), the word "none" in grey
   (assessed and silent), and italic "not assessable" (no coverage at all). */
.txchip{display:inline-block;padding:1px 6px;border-radius:8px;color:#fff;font-size:11px;
  font-family:ui-monospace,Menlo,monospace}
.txnone{color:#8a8a92;font-size:11px}
.txna{color:#a09aa8;font-size:11px;font-style:italic}
.txanti{color:#8a6bbf;font-size:11px}
.txsense{color:#2e8b57;font-size:11px}
.vbox{padding:6px 10px;background:#fafafc;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <h1>HERV catalog browser <span id="sub">loading index…</span></h1>
  <div class="searchbar">
    <select id="kspace"></select>
    <div class="sw">
      <input id="q" placeholder="type an identifier…" autocomplete="off" spellcheck="false">
      <div id="results"></div>
      <div id="hint"></div>
    </div>
  </div>
</header>
<main><div id="view"><div class="empty">Pick a system and start typing to find a locus.</div></div></main>

<script>
const MAXSHOW=20, IDENT_LABEL={combined_id:"combined_id (positional)",versioned_id:"versioned_id (with version)",
  telescope_id:"telescope_id",hervd_id:"HERVd ID",ervmap_id:"ERVmap ID",ervmap_alt_name:"ERVmap alt name",
  subramanian_id:"Subramanian 2011 locus (HML-2)",hml2_k_number:"HML-2 K-number (Subramanian)",
  hml2_k_designation:"HML-2 K-designation (Subramanian)",hgnc_ervk_symbol:"HGNC ERVK symbol",
  missillac_id:"Missillac ID (ERV Navigator)",rbrt_id:"RBRT ID (ERV Navigator legacy)"};
const NAV_URL="https://ervnavigator.fredhutch.org/locus/";
const CLASS_LABEL={dfam_int_model:"Dfam internal model",dfam_accession:"Dfam accession",repbase_name:"RepBase name"};
let IDX=null, NB=400, shardCache=new Map(), curSel=-1, curList=[];
let FZ=null, LM=null, KPOS=null, CPOS=null, MPOS=null, listState=null;
// TU layer: present only in a --debug-local bundle. TUMETA stays null in the
// public build and every TU code path checks it, so one front-end serves both.
let TUMETA=null, TUIDS=null, TUIDX=null, tuShardCache=new Map();
const PAGE=100;
// Match tiers, best first. Kept explicit rather than a score so the badge in the
// results list says exactly which kind of match produced the hit.
const TIER={EXACT:0,NORM:1,PREFIX:2,COLLAPSE:3,CPREFIX:4};
const TIER_BADGE=["","normalised","prefix","prefix-collapsed","prefix-collapsed"];
const nrm=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
const nrmc=s=>nrm(s).replace(/^(HERV|ERV)/,"");
// binary search for the first key >= q
function lb(arr,q){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;
  if(arr[m]<q)lo=m+1;else hi=m;}return lo;}

function djb2(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)+s.charCodeAt(i))>>>0;return h;}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null||n===""?"—":(typeof n==="number"?n.toLocaleString():esc(n));
const bp=n=>n==null?"—":Number(n).toLocaleString()+" bp";

async function boot(){
  try{ await boot_(); }catch(e){ showError("Startup",e); }
}
async function boot_(){
  const r=await fetch("data/search_index.json.gz");
  IDX=JSON.parse(await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).text());
  const sm=await (await fetch("data/shard_meta.json")).json(); NB=sm.n_buckets;
  // Optional TU layer. A 404 here is the normal public-bundle case, not an error,
  // so it is swallowed deliberately rather than surfaced through showError().
  try{
    const rm=await fetch("data/tu_meta.json");
    if(rm.ok){
      TUMETA=await rm.json();
      const ri=await fetch("data/tu_index.json.gz");
      TUIDX=JSON.parse(await new Response(ri.body.pipeThrough(new DecompressionStream("gzip"))).text());
      TUIDS=Object.keys(TUIDX).sort();
    }
  }catch(e){ TUMETA=null; }
  FZ=IDX.fuzzy; LM=IDX.listmeta;
  // key -> posting index, built once. 150k entries; a Map lookup beats
  // Object.keys() scans on every keystroke.
  KPOS=new Map(); FZ.keys.forEach((k,i)=>KPOS.set(k,i));
  CPOS=new Map(); FZ.ckeys.forEach((k,i)=>CPOS.set(k,i));
  // per-type string counts for the dropdown labels, from the fuzzy postings
  const tcount=FZ.types.map(()=>new Set());
  FZ.post.forEach(pl=>pl.forEach(p=>tcount[p[1]].add(p[2])));

  const ks=$("kspace");
  const gAll=document.createElement("optgroup"); gAll.label="All identifiers";
  const oAll=document.createElement("option"); oAll.value="f:*"; oAll.selected=true;
  oAll.textContent="Fuzzy search — any naming scheme  ("+
    FZ.keys.length.toLocaleString()+")";
  gAll.appendChild(oAll); ks.appendChild(gAll);

  let g1=document.createElement("optgroup"); g1.label="Identifier — resolves to one locus";
  for(const t of IDX.meta.ident_types){const o=document.createElement("option");o.value="i:"+t;
    o.textContent=(IDENT_LABEL[t]||t)+"  ("+tcount[FZ.types.indexOf(t)].size.toLocaleString()+")";g1.appendChild(o);}
  let g2=document.createElement("optgroup"); g2.label="Classifier — resolves to a locus list";
  for(const t of IDX.meta.class_types){const o=document.createElement("option");o.value="c:"+t;
    o.textContent=(CLASS_LABEL[t]||t)+"  ("+Object.keys(IDX.classifier[t]).length.toLocaleString()+")";g2.appendChild(o);}
  ks.appendChild(g1);ks.appendChild(g2);

  // Internal joining key, last and opt-in. Deliberately excluded from fuzzy
  // search: 96.6% of locus_uids carry a HERVL prefix while belonging to some
  // other group (HERVL000001 is ERV316A3), so surfacing them in a general
  // search would suggest a family membership that does not exist.
  const g3=document.createElement("optgroup"); g3.label="Internal";
  const o3=document.createElement("option"); o3.value="u:uid";
  o3.textContent="locus_uid — internal joining key  ("+FZ.uids.length.toLocaleString()+")";
  g3.appendChild(o3);
  // tu_id, same contract as locus_uid: exact prefix match, opt-in, and excluded
  // from fuzzy search. A tu_id is a coordinate-derived label (CHIMERIC_1q22a,
  // HML2_5p13b) whose prefix describes the unit's composition, not a family a
  // locus belongs to -- in general search it would compete with real family names.
  // Present only when the TU shard set was built (--debug-local).
  if(TUMETA){
    const o4=document.createElement("option"); o4.value="t:tu";
    o4.textContent="tu_id — transcriptional unit  ("+TUMETA.n_units.toLocaleString()+")";
    g3.appendChild(o4);
  }
  ks.appendChild(g3);
  $("sub").textContent=IDX.meta.n_loci.toLocaleString()+" loci";
  ks.onchange=()=>{$("q").value="";onType();$("q").focus();};
  $("q").addEventListener("input",onType);
  $("q").addEventListener("keydown",onKey);
  document.addEventListener("click",e=>{if(!e.target.closest(".sw"))hide();});
  onType();
}
function hide(){$("results").classList.remove("on");curSel=-1;}

/* Cross-keyspace search over the fuzzy postings.
   `only` restricts to one alias type (single-keyspace mode); null searches all.

   Tiers are evaluated best-first and a (uid, matched string) pair is emitted
   once, at its best tier. The collapsed tiers exist because the catalog spells
   HERV-K108 as "K108R" -- but they are NOT merged into the exact tiers: K-10 and
   ERVK-10 are genuinely different loci, so a collapsed hit is badged as such
   rather than presented as an equal match. */
function fuzzySearch(q,only,cap){
  const n=nrm(q); if(!n)return [];
  const c=nrmc(q), out=[], seen=new Map();
  const tix=only==null?-1:FZ.types.indexOf(only);
  const take=(tier,ki)=>{
    for(const p of FZ.post[ki]){
      if(tix>=0&&p[1]!==tix)continue;
      const sig=p[0]+"|"+p[2];
      /* One string can name the SAME locus under several schemes (ERVK-15 is both
         an ERVmap alt name and an HGNC symbol). Deduplicate to one row, but keep
         every contributing scheme -- reporting only the first-indexed one would
         mislabel the row's provenance. Distinct loci are never merged here. */
      const prev=seen.get(sig);
      if(prev!==undefined){
        const t=FZ.types[p[1]];
        if(out[prev].types.indexOf(t)<0)out[prev].types.push(t);
        continue;
      }
      seen.set(sig,out.length);
      out.push({tier,uid:FZ.uids[p[0]],type:FZ.types[p[1]],types:[FZ.types[p[1]]],
                str:p[2],cur:p[3],key:FZ.keys[ki]});
    }};
  const ex=KPOS.get(n); if(ex!==undefined)take(nrm(q)===String(q).toUpperCase()?TIER.EXACT:TIER.NORM,ex);
  for(let i=lb(FZ.keys,n);i<FZ.keys.length&&out.length<cap;i++){
    if(!FZ.keys[i].startsWith(n))break;
    if(i!==ex)take(TIER.PREFIX,i);
  }
  if(out.length<cap){
    const ce=CPOS.get(c);
    if(ce!==undefined)for(const ki of FZ.cmap[ce])take(TIER.COLLAPSE,ki);
    for(let i=lb(FZ.ckeys,c);i<FZ.ckeys.length&&out.length<cap;i++){
      if(!FZ.ckeys[i].startsWith(c))break;
      if(i!==ce)for(const ki of FZ.cmap[i])take(TIER.CPREFIX,ki);
    }
  }
  out.sort((a,b)=>a.tier-b.tier||a.str.length-b.str.length||a.str.localeCompare(b.str));
  return out;
}

/* ERV Navigator records that resolve to NO catalog locus (~120k solo LTRs).
   These are real annotations deliberately not promoted to loci, so they have no
   uid and cannot ride the fuzzy postings above. Searched as a separate lane and
   rendered as outbound-only rows: a valid Missillac ID must never come back
   empty, but it must also not masquerade as a locus we annotate. */
function missillacSearch(q,only,cap){
  const MI=IDX.missillac;
  if(!MI||!MI.keys||!MI.keys.length)return [];
  if(only!=null&&only!=="missillac_id"&&only!=="rbrt_id")return [];
  const n=nrm(q); if(!n)return [];
  const out=[], seen=new Set();
  const push=(tier,ki)=>{
    for(const ri of MI.post[ki]){
      if(seen.has(ri))continue;
      seen.add(ri);
      const r=MI.rows[ri];
      // r = [missillac_id, rbrt_id, cat_ix, lineage_id, chrom, start, end, url]
      const matched=(nrm(r[0])===n||nrm(r[0]).startsWith(n))?r[0]:r[1];
      if(only==="missillac_id"&&matched!==r[0])continue;
      if(only==="rbrt_id"&&matched!==r[1])continue;
      out.push({tier,unmapped:true,missillac_id:r[0],rbrt_id:r[1],
                cat:MI.cats[r[2]]||null,lineage_id:r[3],
                chrom:r[4],start:r[5],end:r[6],url:r[7],
                str:matched,type:matched===r[0]?"missillac_id":"rbrt_id"});
    }};
  // MPOS mirrors KPOS/CPOS: a linear indexOf over ~130k keys would run on every
  // keystroke, which is exactly what those maps exist to avoid.
  if(MPOS===null){MPOS=new Map();MI.keys.forEach((k,i)=>MPOS.set(k,i));}
  const exv=MPOS.get(n), ex=(exv===undefined?-1:exv);
  if(ex>=0)push(nrm(q)===String(q).toUpperCase()?TIER.EXACT:TIER.NORM,ex);
  for(let i=lb(MI.keys,n);i<MI.keys.length&&out.length<cap;i++){
    if(!MI.keys[i].startsWith(n))break;
    if(i!==ex)push(TIER.PREFIX,i);
  }
  out.sort((a,b)=>a.tier-b.tier||a.str.length-b.str.length||a.str.localeCompare(b.str));
  return out;
}

function onType(){
  const sel=$("kspace").value,[kind,type]=sel.split(":"),raw=$("q").value.trim(),qs=raw.toUpperCase();

  if(kind==="c"){ // classifier: low cardinality, browse or filter the menu
    const pool=IDX.classifier[type], keys=Object.keys(pool);
    let hits=qs?keys.filter(k=>k.toUpperCase().includes(qs)):keys.slice().sort();
    hits.sort((a,b)=>a.length-b.length||a.localeCompare(b));
    show(hits.slice(0,MAXSHOW*3).map(k=>({k,uids:pool[k],cur:1,kind,type})));
    $("hint").textContent=qs?hits.length+" of "+keys.length+" values"
      :keys.length+" values — scroll or type to filter";
    return;}

  if(kind==="u"){ // internal joining key, explicitly selected
    if(!raw){hide();$("hint").textContent=FZ.uids.length.toLocaleString()+
      " internal keys — HERVL###### (prefix is NOT the family)";return;}
    const hits=[]; const nq=qs;
    for(let i=lb(FZ.uids,nq);i<FZ.uids.length&&hits.length<MAXSHOW*3;i++){
      if(!FZ.uids[i].startsWith(nq))break;
      hits.push({k:FZ.uids[i],uids:[FZ.uids[i]],cur:1,kind,type});}
    show(hits);
    // The caveat stays visible while results are on screen, not only on an empty
    // box: the HERVL prefix is at its most misleading precisely when the user is
    // reading a list of HERVL###### keys whose groups are mostly not HERVL.
    $("hint").textContent=(hits.length?hits.length+" internal key"+(hits.length==1?"":"s")
      :"no internal key starts with that")+" — HERVL prefix is NOT the family";
    return;}

  if(kind==="t"){ // tu_id, explicitly selected -- exact prefix, never fuzzy
    if(!raw){hide();$("hint").textContent=TUMETA.n_units.toLocaleString()+
      " transcriptional units — CHIMERIC_/<group>_<band> (prefix describes the unit)";return;}
    const hits=[];
    for(let i=lb(TUIDS,qs);i<TUIDS.length&&hits.length<MAXSHOW*3;i++){
      if(!TUIDS[i].toUpperCase().startsWith(qs))break;
      hits.push({k:TUIDS[i],uids:[],tu:TUIDS[i],cur:1,kind,type,
                 nmem:(TUIDX[TUIDS[i]]||[]).length});}
    show(hits);
    $("hint").textContent=hits.length?hits.length+" unit"+(hits.length==1?"":"s")
      :"no tu_id starts with that";
    return;}

  if(!raw){hide();
    $("hint").textContent=kind==="f"
      ? FZ.keys.length.toLocaleString()+" strings across all naming schemes"
      : "type an identifier";
    return;}

  const only=kind==="i"?type:null;
  const hits=fuzzySearch(raw,only,MAXSHOW*10);

  /* Two-stage grouping.

     First by matched string+scheme, because one string may name several loci —
     11,475 combined_id strings do. Collapsing straight to loci would render such
     a string as N identical-looking rows and lose the "N loci" badge that sends
     the click to a disambiguation list instead of a guessed locus.

     Then by locus set, so the several spellings that name the same locus (K108R
     and the packed "K108R, ERVK-6") arrive as one row that discloses both. */
  const byS=new Map();
  for(const h of hits){
    const sig=h.str+"\u0000"+h.type;
    if(!byS.has(sig))byS.set(sig,{k:h.str,type:h.type,types:(h.types||[h.type]).slice(),
                                  tier:h.tier,cur:h.cur,uids:[]});
    const g=byS.get(sig);
    for(const t of (h.types||[h.type]))if(g.types.indexOf(t)<0)g.types.push(t);
    g.uids.push(h.uid);
    if(h.tier<g.tier)g.tier=h.tier;
    if(!h.cur)g.cur=0;
  }
  const byU=new Map();
  for(const g of byS.values()){
    const sig=g.uids.slice().sort().join("|");
    if(!byU.has(sig)){byU.set(sig,{k:g.k,uids:g.uids,cur:g.cur,kind:"i",
      type:g.type,types:g.types.slice(),tier:g.tier,alts:[]});continue;}
    const m=byU.get(sig);
    if(g.tier<m.tier){ // a better-tier spelling becomes the headline
      m.alts.unshift({s:m.k,t:m.type}); m.k=g.k; m.type=g.type; m.types=g.types.slice();
      m.tier=g.tier;
    } else if(m.alts.length<4&&!m.alts.some(a=>a.s===g.k)) m.alts.push({s:g.k,t:g.type});
    if(!g.cur)m.cur=0;
  }
  const rows=[...byU.values()].sort((a,b)=>a.tier-b.tier||a.k.length-b.k.length)
                              .slice(0,MAXSHOW*3);
  /* ERV Navigator records with no catalog locus, appended AFTER the locus hits.
     Ranked below every locus row on purpose: they are outbound references, not
     loci we annotate, so they must never outrank a real hit. */
  const mrows=missillacSearch(raw,only,MAXSHOW).map(h=>({
    k:h.str,uids:[],cur:1,kind:"m",type:h.type,types:[h.type],tier:h.tier,alts:[],
    nav:h}));
  rows.push(...mrows.slice(0,MAXSHOW));
  show(rows);
  const nLoci=new Set(hits.map(h=>h.uid)).size;
  const nT=rows.filter(h=>h.tier>=TIER.COLLAPSE).length;
  $("hint").textContent=nLoci?rows.length.toLocaleString()+" result"+(rows.length==1?"":"s")+
      " · "+nLoci.toLocaleString()+(nLoci==1?" locus":" loci")+
      (nT?" — "+nT+" via prefix-collapse (see badge)":"")
    :"no match in any naming scheme";
}
function show(hits){
  const R=$("results");
  // curList MUST be cleared here, not just on a non-empty result. The early return
  // used to leave the PREVIOUS query's hits live behind a "no match" dropdown, so
  // arrow-key selection (curSel is also reset) or a stale index could open an
  // entity the user never searched for. Caught by simsearch.mjs, which read a
  // previous query's result back after a deliberately non-matching one.
  if(!hits.length){curList=[];curSel=-1;
    R.innerHTML='<div class="ri"><em>no match</em></div>';R.classList.add("on");return;}
  curList=hits;
  R.innerHTML=curList.map((h,i)=>{
    const n=h.uids.length, badges=[];
    if(h.kind==="i"&&!h.cur)badges.push('<span class="badge retired">retired</span>');
    if(h.tier>=TIER.COLLAPSE)badges.push('<span class="badge collapse" title="matched only after '+
      'dropping a leading HERV/ERV — these are separate numbering systems, verify before use">'+
      TIER_BADGE[h.tier]+"</span>");
    else if(h.tier===TIER.PREFIX)badges.push('<span class="badge">prefix</span>');
    if(n>1)badges.push('<span class="badge ambig">'+n+" loci</span>");
    if(h.kind==="c")badges.push('<span class="badge">'+n.toLocaleString()+" loci</span>");
    if(h.kind==="u")badges.push('<span class="badge">internal key</span>');
    if(h.kind==="t")badges.push('<span class="badge">unit · '+h.nmem+
      (h.nmem===1?" locus":" loci")+"</span>");
    // Unmapped ERV Navigator record: says so plainly. The category is the useful
    // fact (almost all are solo LTRs, which this catalog does not annotate as loci).
    if(h.kind==="m")badges.push('<span class="badge collapse" title="ERV Navigator '+
      'record with no overlapping locus in this catalog — opens on ervnavigator.fredhutch.org">'+
      esc(h.nav.cat||"Navigator")+" · no catalog locus</span>");
    // what the matched string resolves to, plus which scheme it came from
    const sec=(h.kind==="i"||h.kind==="u")&&n===1?(IDX.uid2cid[h.uids[0]]||""):"";
    // name EVERY scheme the string belongs to, not just the first indexed one
    const tl=(h.types&&h.types.length?h.types:(h.type?[h.type]:[]));
    const ty=(h.kind==="i"||h.kind==="m")&&tl.length
      ?'<span class="tsrc">'+tl.map(t=>esc(IDENT_LABEL[t]||t)).join(" · ")+"</span>":"";
    // For an unmapped record the lineage + hg38 position is all we can offer in
    // place of a combined_id, and it is what tells the user where it sits.
    const navsec=h.kind==="m"
      ?' <em>'+esc(h.nav.lineage_id||"")+(h.nav.chrom?" · "+esc(h.nav.chrom)+":"+
        (h.nav.start==null?"?":Number(h.nav.start).toLocaleString()):"")+"</em>":"";
    const alts=(h.alts&&h.alts.length)
      ? '<div class="alts">also '+h.alts.map(a=>"<b>"+esc(a.s)+"</b> <em>"+
          esc(IDENT_LABEL[a.t]||a.t)+"</em>").join(", ")+"</div>" : "";
    return '<div class="ri" data-i="'+i+'"><span><b>'+esc(h.k)+"</b> "+ty+navsec+
      (sec&&sec!==h.k?' <em>→ '+esc(sec)+"</em>":"")+alts+"</span><span>"+badges.join(" ")+"</span></div>";
  }).join("");
  R.classList.add("on");
  [...R.querySelectorAll(".ri[data-i]")].forEach(el=>el.onclick=()=>pick(+el.dataset.i));
}
function onKey(e){
  const items=[...$("results").querySelectorAll(".ri[data-i]")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();
    if(!items.length)return; curSel=(curSel+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;
    items.forEach((el,i)=>el.classList.toggle("sel",i===curSel));
    items[curSel].scrollIntoView({block:"nearest"});}
  else if(e.key==="Enter"){if(curSel>=0)pick(+items[curSel].dataset.i);else if(items.length===1)pick(0);}
  else if(e.key==="Escape")hide();
}
// Errors inside an async handler become unhandled rejections and vanish silently —
// a bad shard then looks like "click does nothing". Always surface to the page.
function showError(where,e){
  console.error(where,e);
  $("view").innerHTML='<div class="panel"><h2 style="color:#a33">'+esc(where)+' failed</h2>'+
    '<div class="note mono" style="white-space:pre-wrap">'+esc(e&&e.message||String(e))+'</div>'+
    '<div class="note">Check the browser console for the stack. If this mentions JSON, the data bundle is malformed — rebuild it.</div></div>';
}
async function pick(i){
  try{
    const h=curList[i]; hide(); $("q").value=h.k;
    // Unmapped ERV Navigator record: there is no shard to fetch, so render a
    // stub that states plainly what it is and links out. Silently doing nothing
    // (or throwing a "absent from shard" error) would read as a broken index.
    if(h.kind==="m")return renderMissillacStub(h.nav);
    if(h.kind==="t"){
      const t=await getTU(h.tu);
      if(!t) throw new Error("unit "+h.tu+" absent from TU shard "+(djb2(h.tu)%NB));
      return renderTU(t,h);
    }
    if(h.uids.length===1){
      const d=await getLocus(h.uids[0]);
      if(!d) throw new Error("locus "+h.uids[0]+" absent from shard "+(djb2(h.uids[0])%NB));
      return render(d,h);
    }
    // No shard fetches: listmeta holds every locus, so a 6,815-row family
    // renders and pages instantly instead of pulling ~22 MB of shards.
    renderList(h);
  }catch(e){ showError("Loading locus",e); }
}
/* Stub view for an ERV Navigator record with no catalog counterpart.

   Deliberately spare: we hold no evidence layers for these, and dressing the page
   up with empty panels would imply we do. It states the record's own facts, says
   why there is no locus page, and links out. The hg38 coordinates are OUR lift of
   the published hg19 span, and are labelled as such — presenting them unqualified
   would attribute a coordinate to ERV Navigator that it never published. */
function renderMissillacStub(r){
  const url=r.url||(NAV_URL+encodeURIComponent(r.missillac_id));
  const pos=r.chrom?esc(r.chrom)+":"+Number(r.start).toLocaleString()+"-"+
                    Number(r.end).toLocaleString():null;
  $("view").innerHTML='<div class="panel"><h2>'+esc(r.missillac_id)+
    ' <span class="badge collapse">no catalog locus</span></h2>'+
    '<dl class="kv">'+
      kvx("Missillac ID",r.missillac_id)+kvx("RBRT ID (legacy)",r.rbrt_id)+
      kvx("category",r.cat)+kvx("lineage",r.lineage_id)+
      kvx("hg38 (lifted here)",pos)+
    '</dl>'+
    '<div class="note">This ERV Navigator record does not overlap any locus in this '+
    'catalog. Almost all such records are solo LTRs, which this catalog does not '+
    'annotate as loci — its spans are internal-element extents. The record is '+
    'indexed here so the identifier resolves; the authoritative page is on ERV '+
    'Navigator.</div>'+
    '<div class="note">hg38 coordinates shown are this project\u2019s liftOver of the '+
    'published hg19 span, not an ERV Navigator coordinate.</div>'+
    '<p><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Open on ERV Navigator \u2197</a></p>'+
    '</div>';
}
function kvx(k,v){return v==null||v===""?"":"<dt>"+esc(k)+"</dt><dd>"+esc(String(v))+"</dd>";}
async function getTU(tid){
  const b=djb2(tid)%NB;
  if(!tuShardCache.has(b)){
    const r=await fetch("data/tu/"+b+".json.gz");
    if(!r.ok) throw new Error("TU shard "+b+" fetch failed: HTTP "+r.status);
    const txt=await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).text();
    let obj;
    try{ obj=JSON.parse(txt); }
    catch(e){ throw new Error("TU shard "+b+" is not valid JSON ("+e.message+")"); }
    tuShardCache.set(b,obj);
  }
  return tuShardCache.get(b)[tid];
}
async function getLocus(uid){
  const b=djb2(uid)%NB;
  if(!shardCache.has(b)){
    const r=await fetch("data/loci/"+b+".json.gz");
    if(!r.ok) throw new Error("shard "+b+" fetch failed: HTTP "+r.status);
    const txt=await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).text();
    let obj;
    try{ obj=JSON.parse(txt); }
    catch(e){ throw new Error("shard "+b+" is not valid JSON ("+e.message+
      "). Non-finite values such as NaN are not legal JSON — rebuild with allow_nan=False."); }
    shardCache.set(b,obj);
  }
  return shardCache.get(b)[uid];
}
if(typeof window!=="undefined"&&window.addEventListener){
  window.addEventListener("unhandledrejection",e=>showError("Async operation",e.reason||e));
  window.addEventListener("error",e=>showError("Script error",e.error||e.message));
}
/* Paged, filterable locus list.

   Rows come from listmeta (uid-index aligned with FZ.uids), not from shards, so
   filtering and paging are pure array work. The filter is a substring match on
   combined_id -- the column the user actually scans -- and re-pages the matching
   subset rather than filtering only the visible page. */
const uidIx=new Map();
function uidIndex(u){
  if(!uidIx.size)FZ.uids.forEach((x,i)=>uidIx.set(x,i));
  return uidIx.get(u);
}
function renderList(h){
  const idxs=h.uids.map(uidIndex).filter(i=>i!==undefined);
  listState={h,idxs,filt:"",page:0};
  $("view").innerHTML='<div class="panel"><h2 id="lh"></h2>'+
    '<div class="lbar"><input id="lf" placeholder="filter combined_id…" autocomplete="off" '+
    'spellcheck="false"><span id="lc" class="note"></span></div>'+
    '<div id="ltab"></div><div id="lpg" class="pager"></div></div>';
  $("lf").addEventListener("input",()=>{listState.filt=$("lf").value.trim().toUpperCase();
    listState.page=0;drawList();});
  drawList();
}
function listRows(){
  const {idxs,filt}=listState, R=LM.rows;
  return filt?idxs.filter(i=>R[i][0].toUpperCase().includes(filt)):idxs;
}
function drawList(){
  const {h}=listState, rows=listRows(), R=LM.rows;
  const nPage=Math.max(1,Math.ceil(rows.length/PAGE));
  if(listState.page>=nPage)listState.page=nPage-1;
  const p=listState.page, slice=rows.slice(p*PAGE,(p+1)*PAGE);
  $("lh").textContent=h.k+" — "+h.uids.length.toLocaleString()+" loci";
  $("lc").textContent=listState.filt
    ? rows.length.toLocaleString()+" of "+h.uids.length.toLocaleString()+" match “"+listState.filt+"”"
    : h.uids.length.toLocaleString()+" loci";
  $("ltab").innerHTML=slice.length
    ? '<table><tr><th>combined_id</th><th>group</th><th>band</th><th>hg38</th><th>origin</th></tr>'+
      slice.map(i=>{const r=R[i], ch=r[3]>=0?LM.chroms[r[3]]:"";
        return '<tr><td><a href="#" class="mono" data-u="'+esc(FZ.uids[i])+'">'+esc(r[0])+"</a></td><td>"+
          esc(r[1]>=0?LM.groups[r[1]]:"—")+"</td><td>"+fmt(r[2])+"</td><td class=mono>"+
          (ch&&r[4]>=0?esc(ch)+":"+fmt(r[4])+"-"+fmt(r[5]):"—")+"</td><td>"+
          esc(r[6]>=0?LM.origins[r[6]]:"—")+"</td></tr>";}).join("")+"</table>"
    : '<div class="note">no combined_id matches that filter</div>';
  const lo=rows.length?p*PAGE+1:0, hi=Math.min((p+1)*PAGE,rows.length);
  $("lpg").innerHTML=rows.length>PAGE
    ? '<button id="pp"'+(p===0?" disabled":"")+">‹ prev</button>"+
      '<span class="note">'+lo.toLocaleString()+"–"+hi.toLocaleString()+" of "+
      rows.length.toLocaleString()+"  (page "+(p+1)+" of "+nPage+")</span>"+
      '<button id="pn"'+(p>=nPage-1?" disabled":"")+">next ›</button>"
    : (rows.length?'<span class="note">showing all '+rows.length.toLocaleString()+"</span>":"");
  if($("pp"))$("pp").onclick=()=>{listState.page--;drawList();};
  if($("pn"))$("pn").onclick=()=>{listState.page++;drawList();};
  [...$("ltab").querySelectorAll("a[data-u]")].forEach(a=>a.onclick=async e=>{
    e.preventDefault();
    try{ const d=await getLocus(a.dataset.u);
      if(!d)throw new Error("locus "+a.dataset.u+" absent from shard "+(djb2(a.dataset.u)%NB));
      render(d,h);
    }catch(err){ showError("Loading locus",err); }});
}
</script>
